<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Dashboard videogiocatore</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="esercizio.css">
    </head>
    <body>

        <div class="container">
            <h1>Dashboard Videogiocatore</h1>
            <p>Personalizza e salva le tue preferenze di gioco.</p>

            <form class="form">

                <div class="card">
                    <label for="nome">Nome giocatore</label>
                    <input type="text" id="nome" placeholder="Nome giocatore" required>
                </div>

                <div class="card">
                    <label for="gioco">Gioco preferito</label>
                    <input type="text" id="gioco" placeholder="Gioco preferito" required>
                </div>

                <div class="card">
                    <label for="nome">Piattaforma preferita</label>
                    <input type="text" id="piattaforma" placeholder="Piattaforma preferita" required>
                </div>
            </form>

            <button onclick="salvaDati()">Salva dati</button>
            <button onclick="cancellaDati()">Cancella dati</button>
            <button onclick="cambiaTema()">Cambia Tema</button>

            <div id="profilo" class="profile"></div>
        </div>
        
        
        <script src="esercizio.js" async defer></script>
    </body>
</html>
