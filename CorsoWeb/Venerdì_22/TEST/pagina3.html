<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Centro adozioni canine</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <h1>Un rifugio per cani</h1>
    <nav class="container navbar">
      <img class="logo" src="logo_canile.jpg" alt="Logo del canile">

      <ul class="menu">
        <li><a class="active" href="pagina1.html">Home</a></li>
        <li><a href="pagina2.html">Cani da adottare</a></li>
        <li><a href="pagina3.html">Info</a></li>
      </ul>
    </nav>
  </header>

    <main>
    <section class="registrazione">
    <div class="contenitore">
      <div class="testo-registrazione">
        <h2>Registrati per adottare un cane</h2>
        <p>
          Crea il tuo account per iniziare il percorso di adozione. Riceverai 
          aggiornamenti sui cani disponibili e potrai contattare il nostro rifugio. 
        </p>
      </div>

      <form class="form-registrazione">
        <div class="form-gruppo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Inserisci il tuo nome" required>
        </div>

        <div class="form-gruppo">
          <label for="cognome">Cognome</label>
          <input type="text" id="cognome" placeholder="Inserisci il tuo cognome" required>
        </div>

        <div class="form-gruppo">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Inserisci la tua email" required>
        </div>

         <div class="form-gruppo">
          <label for="telefono">Telefono</label>
          <input type="tel" id="telefono" placeholder="Numero di telefono" required>
        </div>

        <div class="form-gruppo">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Crea una password" required>
        </div>

        <div class="form-gruppo">
          <label for="conferma">Conferma Password</label>
          <input type="password" id="conferma" placeholder="Conferma la password" required>
        </div>

        <button type="submit" class="button">
            Inizia l'adozione
        </button>
      </form>
    </div>
  </section>
  </main>

       
        
        <script src="script.js" async defer></script>
    </body>
</html>
