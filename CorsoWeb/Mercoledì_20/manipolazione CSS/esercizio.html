<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="esercizio.css">

    <body>

        <h1 id="titolo">Titolo principale</h1>

        <div id="box">
            <p id="testo">Testo</p>
        </div>

        <div>
            <input type="text" id="nome" placeholder="Inserisci un elemento">
        </div>

            <h2>Bottoni HTML</h2>

       <ul class="lista-bottoni">
            <li>
                <button id="bottoneCrea">
                    Aggiungi nuovo elemento
                </button>
            </li>

            <li>
                <button id="bottoneModifica">
                    Modifica il testo del titolo
                </button>
            </li>

            <li>
                <button id="bottoneElimina">
                     Elimina l'ultimo elemento della lista
                </button>
            </li>

        </ul><ul id="lista"></ul>

        <h2>Bottoni CSS</h2>

        <ul class="lista-bottoni2">
            <li>
                <button id="cambiaColore">
                    Cambia colore del titolo
                </button>
            </li>

            <li>
                <button id="cambiaSfondo">
                    Modifica sfondo del div
                </button>
            </li>

            <li>
                <button id="DimTesto">
                    Aumenta dimensione del testo
                </button>
            </li>

            <li>
                <button id="nascondi">
                    Nascondi l'elemento
                </button>
            </li>

            <li>
                <button id="mostra">
                    mostra l'elemento
                </button>
            </li>
        </ul>

        
       
        
        <script src="esercizio.js" async defer></script>
    </body>
</html>
